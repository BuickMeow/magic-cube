<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>修改密码 - 语文天地</title>
    
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<div class="container">
    <div class="illustration-side">
        <div class="logo-text">
            <img src="/images/微信图片_20260401134545.png" alt="Logo" class="logo-img">
            语文天地
        </div>
        <img src="/images/微信图片_20260401134532.png" alt="插图" class="illustration-img">
    </div>

    <div class="form-side">
        <div class="form-box">
            <div class="avatar-circle">🔐</div>
            <h1>修改密码</h1>

            <p th:if="${error}" class="error-tip" th:text="${error}"></p>
            <p th:if="${success}" class="success-tip" th:text="${success}"></p>

            <form th:action="@{/change-password}" method="post">
                <div class="form-item">
                    <input type="password" name="oldPassword" required placeholder="请输入当前密码">
                </div>

                <div class="form-item">
                    <input type="password" name="newPassword" required placeholder="请输入新密码（至少 6 位）" minlength="6">
                </div>

                <div class="form-item">
                    <input type="password" name="confirmNewPassword" required placeholder="请再次输入新密码" minlength="6">
                </div>

                <button type="submit" class="submit-btn">确认修改</button>
            </form>

            <div class="tip">
                <a th:href="@{/}">← 返回首页</a>
                <span class="separator">|</span>
                <a th:href="@{/profile}">个人资料</a>
            </div>
        </div>
    </div>
</div>
<div class="header-right">
    <div class="user-info" onclick="window.location.href='/profile'">
        <div class="user-avatar">👤</div>
        <span class="username" th:if="${user != null}">
            <span th:if="${user.role == 'admin' && user.name != null}" th:text="'Hi, ' + ${user.name} + '老师'"></span>
            <span th:if="${user.role == 'admin' && user.name == null}" th:text="'Hi, ' + ${user.username} + '老师'"></span>
            <span th:if="${user.role != 'admin' && user.name != null}" th:text="'Hi, ' + ${user.name} + '同学'"></span>
            <span th:if="${user.role != 'admin' && user.name == null}" th:text="'Hi, ' + ${user.username} + '同学'"></span>
        </span>
    </div>
    <a th:href="@{/logout}" class="logout-btn">退出登录</a>
</div>

</body>
</html>
