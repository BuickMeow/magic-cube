<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>忘记密码 - 语文天地</title>
    
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<div class="container">
    <div class="logo-text">
        <img src="/images/微信图片_20260401134545.png" alt="Logo" class="logo-img">
        语文天地
    </div>

    <div class="illustration-side">
        <img src="/images/微信图片_20260401134532.png" alt="插图" class="illustration-img">
    </div>

    <div class="forgot-side">
        <div class="forgot-box">
            <div class="avatar-circle">📝</div>
            <h1>忘记密码</h1>

            <p th:if="${error}" class="error-tip" th:text="${error}"></p>
            <p th:if="${success}" class="success-tip" th:text="${success}"></p>

            <form th:action="@{/forgot-password}" method="post">
                <div class="form-item">
                    <input type="text" name="username" required placeholder="请输入您的用户名">
                </div>

                <div class="form-item">
                    <input type="password" name="newPassword" required placeholder="请输入新密码（至少 6 位）" minlength="6">
                </div>

                <div class="form-item">
                    <input type="password" name="confirmPassword" required placeholder="请再次输入新密码" minlength="6">
                </div>

                <button type="submit" class="submit-btn">确认修改密码</button>
            </form>

            <div class="tip">
                记得密码了？<a th:href="@{/login}">去登录</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
