<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>个人资料 - 语文天地</title>
    
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="has-sidebar">
<div class="header">
    <div class="header-left">
        <div class="logo">
            <img th:src="@{/images/微信图片_20260405124109.png}" alt="Logo" onerror="this.style.display='none'">
            <span>语文天地</span>
        </div>
        <div class="nav">
            <a th:href="@{/}">首页</a>
            <th:block th:if="${user != null && user.role != 'admin'}">
                <a th:href="@{/forum}">班级留言板</a>
                <a th:href="@{/energy}">能量监测窗</a>
                <a th:href="@{/questionnaire}">心理问卷评估</a>
                <a th:href="@{/diagnosis/personal}">学情诊断报告</a>
                <a th:href="@{/intervention}">干预记录</a>
            </th:block>
            <th:block th:if="${user != null && user.role == 'admin'}">
                <a th:href="@{/energy/admin}">课堂数据看板</a>
                <a th:href="@{/forum}">班级留言板</a>
                <a th:href="@{/diagnosis/class}">学情诊断报告</a>
                <a th:href="@{/teaching-resources}">教学资源库</a>
                <a th:href="@{/intervention}">干预记录</a>
            </th:block>
        </div>
    </div>
    <div class="header-right">
        <div class="user-info" onclick="window.location.href='/profile'">
            <div class="user-avatar">👤</div>
            <span class="username" th:if="${user != null}">
                <span th:if="${user.role == 'admin' && user.name != null}" th:text="'Hi, ' + ${user.name} + '老师'"></span>
                <span th:if="${user.role == 'admin' && user.name == null}" th:text="'Hi, ' + ${user.username} + '老师'"></span>
                <span th:if="${user.role != 'admin' && user.name != null}" th:text="'Hi, ' + ${user.name} + '同学'"></span>
                <span th:if="${user.role != 'admin' && user.name == null}" th:text="'Hi, ' + ${user.username} + '同学'"></span>
            </span>
        </div>
        <a th:href="@{/logout}" class="logout-btn">退出登录</a>
    </div>
</div>

<div class="container">
    <div class="page-title">个人资料</div>
    <div class="page-desc">管理您的个人信息和账户设置</div>

    <div class="card">
        <div class="card-header">
            <div class="card-title">👤 个人资料</div>
        </div>
        
        <p th:if="${error}" class="error-tip" th:text="${error}"></p>
        <p th:if="${success}" class="success-tip" th:text="${success}"></p>
        
        <form th:action="@{/profile}" method="post">
            <!-- 账户信息 -->
            <div class="form-section">
                <div class="form-section-title">🔐 账户信息</div>
                
                <div class="current-info">
                    <p>当前角色：<span class="role-badge" th:classappend="${user.role == 'admin'} ? 'admin' : 'student'">
                        <span th:if="${user.role == 'admin'}">👨‍🏫 教师</span>
                        <span th:if="${user.role != 'admin'}">👨‍🎓 学生</span>
                    </span></p>
                    <p>注册时间：<span th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></span></p>
                </div>
                
                <div class="form-item">
                    <label>🆔 用户名<span style="color: #909399; font-weight: normal; font-size: 12px;">（用于登录和显示）</span></label>
                    <input type="text" name="username" th:value="${user.username}" required placeholder="请输入新的用户名">
                    <p class="tip">修改用户名后，下次登录需使用新用户名</p>
                </div>
            </div>
            
            <!-- 个人信息 -->
            <div class="form-section">
                <div class="form-section-title">📝 个人信息</div>
                
                <div class="form-row">
                    <div class="form-item">
                        <label>📛 真实姓名</label>
                        <input type="text" name="name" th:value="${user.name}" placeholder="请输入真实姓名">
                    </div>
                    
                    <div class="form-item">
                        <label>🎭 性别</label>
                        <select name="gender">
                            <option value="">请选择</option>
                            <option value="male" th:selected="${user.gender == 'male'}">男</option>
                            <option value="female" th:selected="${user.gender == 'female'}">女</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-item">
                        <label>🎂 年龄</label>
                        <input type="number" name="age" th:value="${user.age}" min="10" max="100" placeholder="请输入年龄（可选）">
                    </div>
                    
                    <div class="form-item">
                        <label>📚 年级</label>
                        <select name="grade">
                            <option value="">请选择</option>
                            <option value="初一" th:selected="${user.grade == '初一'}">初一</option>
                            <option value="初二" th:selected="${user.grade == '初二'}">初二</option>
                            <option value="初三" th:selected="${user.grade == '初三'}">初三</option>
                            <option value="高一" th:selected="${user.grade == '高一'}">高一</option>
                            <option value="高二" th:selected="${user.grade == '高二'}">高二</option>
                            <option value="高三" th:selected="${user.grade == '高三'}">高三</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-item">
                    <label>🏫 班级 ID</label>
                    <input type="text" name="classId" th:value="${user.classId}" readonly placeholder="班级 ID 不可修改">
                    <p class="tip">班级 ID 由管理员设置，个人无法修改</p>
                </div>
            </div>
            
            <button type="submit" class="submit-btn">💾 保存修改</button>
        </form>
    </div>
    
    <div class="card">
        <div class="card-header">
            <div class="card-title">🔗 快捷操作</div>
        </div>
        <div class="action-buttons">
            <a th:href="@{/change-password}" class="btn-action btn-success">🔐 修改密码</a>
            <a th:href="@{/}" class="btn-action btn-secondary">← 返回首页</a>
        </div>
    </div>
</div>
</body>
</html>
