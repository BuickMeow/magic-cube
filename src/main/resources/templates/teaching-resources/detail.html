<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${resource.title} + ' - 教学资源库'">课文详情</title>
    
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="has-sidebar">
<div class="header">
    <div class="header-left">
        <div class="logo">
            <img th:src="@{/images/微信图片_20260405124109.png}" alt="Logo" onerror="this.style.display='none'">
            <span>语文天地</span>
        </div>
        <div class="nav">
            <a th:href="@{/}">首页</a>
            <a th:href="@{/teaching-resources}" class="active">教学资源库</a>
        </div>
    </div>
    <div class="header-right">
        <div class="user-info" onclick="window.location.href='/profile'">
            <div class="user-avatar">👤</div>
            <span class="username" th:if="${user != null}">
                <span th:if="${user.role == 'admin' && user.name != null}" th:text="'Hi, ' + ${user.name} + '老师'"></span>
                <span th:if="${user.role == 'admin' && user.name == null}" th:text="'Hi, ' + ${user.username} + '老师'"></span>
                <span th:if="${user.role != 'admin' && user.name != null}" th:text="'Hi, ' + ${user.name} + '同学'"></span>
                <span th:if="${user.role != 'admin' && user.name == null}" th:text="'Hi, ' + ${user.username} + '同学'"></span>
            </span>
        </div>
        <a th:href="@{/logout}" class="logout-btn">退出登录</a>
    </div>
</div>

<div class="container">
    <div class="card">
        <div class="toolbar">
            <div class="toolbar-left">
                <a th:if="${currentParentId == 0}" th:href="@{/teaching-resources}" class="btn btn-back">返回全部课文</a>
                <a th:if="${currentParentId > 0}" th:href="@{/teaching-resources/{id}(id=${resource.id})}" class="btn btn-back-orange">返回课文目录</a>

                <h2>
                    <span th:text="${resource.title}"></span>
                    <span th:if="${currentFolder != null}" th:text="' / ' + ${currentFolder.fileName}" style="color: #606266; font-size: 16px;"></span>
                </h2>
            </div>

            <div class="btn-group">
                <button onclick="showModal('folderModal')" class="btn btn-primary">📁 新建文件夹</button>
                <button onclick="showModal('uploadModal')" class="btn btn-success">☁️ 上传文件</button>
            </div>
        </div>

        <ul class="file-list">
            <li th:if="${#lists.isEmpty(files)}" class="empty-folder">
                <div class="empty-folder-icon">📂</div>
                <div>此文件夹为空，快点击右上角上传文件吧！</div>
            </li>

            <li class="file-item" th:each="file : ${files}">
                <a th:if="${file.fileType == 'folder'}" th:href="@{/teaching-resources/{id}/folder/{folderId}(id=${resource.id}, folderId=${file.id})}" class="file-info">
                    <span class="file-icon">📁</span>
                    <div>
                        <div class="file-name" th:text="${file.fileName}"></div>
                        <div class="file-size">文件夹</div>
                    </div>
                </a>

                <div th:if="${file.fileType != 'folder'}" class="file-info" style="cursor: default;">
                    <span class="file-icon" th:text="${file.fileType == 'video'} ? '🎥' : '📄'"></span>
                    <div>
                        <div class="file-name" th:text="${file.fileName}" style="color: #303133; pointer-events: none;"></div>
                        <div class="file-size" th:if="${file.fileSize != null}" th:text="${#numbers.formatDecimal(file.fileSize / 1024.0, 1, 2)} + ' KB'"></div>
                    </div>
                </div>

                <div class="actions">
                    <a th:if="${file.fileType != 'folder'}" th:href="@{/teaching-resources/{id}/download/{fileId}(id=${resource.id}, fileId=${file.id})}" class="btn btn-primary" style="padding: 8px 16px; font-size: 13px;">下载</a>

                    <form th:action="@{/teaching-resources/{id}/delete-item(id=${resource.id})}" method="post" style="margin: 0;">
                        <input type="hidden" name="itemId" th:value="${file.id}">
                        <input type="hidden" name="parentId" th:value="${currentParentId}">
                        <button type="submit" class="btn btn-danger" onclick="return confirm('确定要永久删除吗？如果是文件夹，里面的所有内容也会被清空！')">🗑️ 删除</button>
                    </form>
                </div>
            </li>
        </ul>
    </div>
</div>

<div id="folderModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-bottom: 20px;">📁 新建文件夹</h3>
        <form th:action="@{/teaching-resources/{id}/create-folder(id=${resource.id})}" method="post">
            <input type="hidden" name="parentId" th:value="${currentParentId}">
            <input type="text" name="folderName" class="modal-input" placeholder="请输入文件夹名称" required>
            <div style="display: flex; justify-content: space-between;">
                <button type="button" onclick="hideModal('folderModal')" class="btn" style="border: 1px solid #dcdfe6; color: #606266;">取消</button>
                <button type="submit" class="btn btn-primary">确定创建</button>
            </div>
        </form>
    </div>
</div>

<div id="uploadModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-bottom: 20px;">☁️ 上传文件</h3>
        <form th:action="@{/teaching-resources/{id}/upload-file(id=${resource.id})}" method="post" enctype="multipart/form-data">
            <input type="hidden" name="parentId" th:value="${currentParentId}">
            <input type="file" name="file" class="modal-input" required>
            <div style="display: flex; justify-content: space-between;">
                <button type="button" onclick="hideModal('uploadModal')" class="btn" style="border: 1px solid #dcdfe6; color: #606266;">取消</button>
                <button type="submit" class="btn btn-success">开始上传</button>
            </div>
        </form>
    </div>
</div>

<script>
    function showModal(id) { document.getElementById(id).style.display = 'flex'; }
    function hideModal(id) { document.getElementById(id).style.display = 'none'; }
</script>
</body>
</html>
