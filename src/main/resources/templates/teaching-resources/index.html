<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>教学资源库 - 语文天地</title>
    
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="has-sidebar">
<div class="header">
    <div class="header-left">
        <div class="logo">
            <img th:src="@{/images/微信图片_20260405124109.png}" alt="Logo" onerror="this.style.display='none'">
            <span>语文天地</span>
        </div>
        <div class="nav">
            <a th:href="@{/}">首页</a>
            <a th:href="@{/energy/admin}">课堂数据看板</a>
            <a th:href="@{/forum}">班级留言板</a>
            <a th:href="@{/diagnosis/class}">学情诊断报告</a>
            <a th:href="@{/teaching-resources}" class="active">教学资源库</a>
        </div>
    </div>
    <div class="header-right">
        <div class="user-info" onclick="window.location.href='/profile'">
            <div class="user-avatar">👤</div>
            <span class="username" th:if="${user != null}">
                <span th:if="${user.role == 'admin' && user.name != null}" th:text="'Hi, ' + ${user.name} + '老师'"></span>
                <span th:if="${user.role == 'admin' && user.name == null}" th:text="'Hi, ' + ${user.username} + '老师'"></span>
                <span th:if="${user.role != 'admin' && user.name != null}" th:text="'Hi, ' + ${user.name} + '同学'"></span>
                <span th:if="${user.role != 'admin' && user.name == null}" th:text="'Hi, ' + ${user.username} + '同学'"></span>
            </span>
        </div>
        <a th:href="@{/logout}" class="logout-btn">退出登录</a>
    </div>
</div>

<div class="container">
    <div class="card">
        <div class="section-header">
            <h2 class="section-title">📚 教学资源库</h2>
            <button onclick="showAddModal()" class="add-btn">+ 新建课文文件夹</button>
        </div>

        <p class="resource-meta">共有 <span th:text="${#lists.size(resources)}"></span> 篇课文的教学资源</p>

        <div class="resource-grid">
            <div class="resource-item" th:each="resource : ${resources}">
                <form th:action="@{/teaching-resources/delete-lesson/{id}(id=${resource.id})}" method="post">
                    <button type="submit" onclick="return confirm('警告：删除此课文将同时删除电脑上对应的文件夹以及里面的所有文件！确定要删除吗？')" class="delete-btn">🗑️</button>
                </form>

                <a th:href="@{/teaching-resources/{id}(id=${resource.id})}" style="text-decoration: none; color: inherit; display: block;">
                    <div class="resource-icon">📖</div>
                    <div class="resource-title" th:text="${resource.title}"></div>
                    <div class="resource-count">进入资源库</div>
                </a>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="addModal">
    <div class="modal">
        <h3 class="modal-title">📝 新建课文文件夹</h3>
        <form th:action="@{/teaching-resources/add-lesson}" method="post">
            <input type="text" name="title" class="modal-input" placeholder="请输入课文标题（如：《背影》）" required>
            <div class="modal-actions">
                <button type="button" onclick="hideAddModal()" class="modal-btn cancel">取消</button>
                <button type="submit" class="modal-btn confirm">确定创建</button>
            </div>
        </form>
    </div>
</div>

<script>
    function showAddModal() {
        document.getElementById('addModal').classList.add('show');
    }
    function hideAddModal() {
        document.getElementById('addModal').classList.remove('show');
    }

    // 点击遮罩层关闭弹窗
    document.getElementById('addModal').addEventListener('click', function(event) {
        if (event.target === this) {
            hideAddModal();
        }
    });

    // ESC 键关闭弹窗
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            hideAddModal();
        }
    });
</script>

</div>
</body>
</html>
