<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>注册 - 语文天地</title>
    
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<div class="container">
    <div class="left-panel">
        <div class="logo">
            <img th:src="@{/images/微信图片_20260405124139.png}" alt="Logo" onerror="this.style.display='none'">
            <span>语文天地</span>
        </div>
        <img th:src="@{/images/微信图片_20260401134532.png}" alt="插图" class="illustration" onerror="this.style.display='none'">
    </div>
    
    <div class="right-panel">
        <div class="header">
            <div class="avatar">
                <img src="/images/微信图片_20260401134545.png" alt="Logo" style="width: 80px; height: 80px; object-fit: contain;">
            </div>
            <h1>语文天地</h1>
        </div>
        
        <p th:if="${error}" class="error-tip" th:text="${error}"></p>
        <p th:if="${success}" class="success-tip" th:text="${success}"></p>
        
        <form th:action="@{/register}" method="post" id="registerForm" class="scrollable-form">
            <div class="form-item">
                <label>用户名 <span class="required">*</span></label>
                <input type="text" name="username" th:value="${username}" required placeholder="请输入用户名（6-20 位字符）" minlength="3" maxlength="20">
            </div>

            <div class="form-item">
                <label>密码 <span class="required">*</span></label>
                <input type="password" name="password" required placeholder="请输入密码（至少 6 位）" minlength="6">
            </div>

            <div class="form-item">
                <label>确认密码 <span class="required">*</span></label>
                <input type="password" name="confirmPassword" required placeholder="请再次输入密码" minlength="6">
            </div>

            <div class="form-item">
                <label>角色类型 <span class="required">*</span></label>
                <div class="role-selection">
                    <label class="role-option" th:classappend="${role == 'student' || role == null} ? 'selected' : ''">
                        <input type="radio" name="role" value="student" th:checked="${role == 'student' || role == null}" onchange="updateRoleStyle(this)">
                        👨‍ 学生
                    </label>
                    <label class="role-option" th:classappend="${role == 'admin'} ? 'selected' : ''">
                        <input type="radio" name="role" value="admin" th:checked="${role == 'admin'}" onchange="updateRoleStyle(this)">
                        👨‍ 教师
                    </label>
                </div>
            </div>

            <div class="form-row">
                <div class="form-item">
                    <label>班级 ID</label>
                    <input type="text" name="classId" placeholder="例如：1 班、2 班">
                </div>

                <div class="form-item">
                    <label>姓名</label>
                    <input type="text" name="name" placeholder="请输入真实姓名">
                </div>
            </div>

            <div class="form-row">
                <div class="form-item">
                    <label>性别</label>
                    <select name="gender">
                        <option value="">请选择</option>
                        <option value="male">男</option>
                        <option value="female">女</option>
                    </select>
                </div>

                <div class="form-item">
                    <label>年龄</label>
                    <input type="number" name="age" min="10" max="100" placeholder="请输入年龄">
                </div>
            </div>

            <div class="form-item">
                <label>年级</label>
                <input type="text" name="grade" placeholder="例如：初一、初二">
            </div>

            <button type="submit" class="register-btn">立即注册</button>
        </form>
        
        <div class="tip">
            已有账号？<a th:href="@{/login}">去登录</a>
        </div>
    </div>
</div>

<script>
function updateRoleStyle(radio) {
    document.querySelectorAll('.role-option').forEach(function(option) {
        option.classList.remove('selected');
    });
    radio.closest('.role-option').classList.add('selected');
}
</script>
</body>
</html>
