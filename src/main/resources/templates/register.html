<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>注册 - 语文魔方</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: url("/images/微信图片_20260401134509.png")no-repeat center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 1000px;
            max-width: 100%;
            display: flex;
        }
        .left-panel {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .logo {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }
        .logo img {
            width: 40px;
            height: 40px;
            margin-right: 10px;
        }
        .logo span {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }
        .illustration {
            max-width: 100%;
            height: auto;
        }
        .right-panel {
            flex: 1;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .avatar {
            width: auto;
            height: auto;
            background: transparent;
            border-radius: 0;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        .header h1 {
            font-size: 24px;
            color: #667eea;
            font-weight: bold;
        }
        .form-item {
            margin-bottom: 20px;
        }
        .form-item label {
            display: block;
            color: #666;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-item input, .form-item select {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e8e8e8;
            border-radius: 25px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .form-item input:focus, .form-item select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .error-tip {
            color: #f56c6c;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
            padding: 10px;
            background-color: #fef0f0;
            border-radius: 8px;
        }
        .success-tip {
            color: #67c23a;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
            padding: 10px;
            background-color: #f0f9ff;
            border-radius: 8px;
        }
        .register-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-top: 10px;
        }
        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .tip {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 14px;
        }
        .tip a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        .tip a:hover {
            text-decoration: underline;
        }
        .role-selection {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .role-option {
            flex: 1;
            padding: 10px;
            border: 2px solid #e8e8e8;
            border-radius: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        .role-option:hover {
            border-color: #667eea;
            background-color: #f5f5fa;
        }
        .role-option.selected {
            border-color: #67c23a;
            background-color: #f0f9ff;
            color: #67c23a;
            font-weight: bold;
        }
        .role-option input[type="radio"] {
            display: none;
        }
        .required {
            color: #f56c6c;
            margin-left: 3px;
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-item {
            flex: 1;
        }
        .scrollable-form {
            max-height: 500px;
            overflow-y: auto;
            padding-right: 10px;
        }
        .scrollable-form::-webkit-scrollbar {
            width: 6px;
        }
        .scrollable-form::-webkit-scrollbar-thumb {
            background-color: #ccc;
            border-radius: 3px;
        }
        .scrollable-form::-webkit-scrollbar-track {
            background-color: #f1f1f1;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .user-info:hover {
            opacity: 0.8;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .username {
            font-size: 14px;
            color: white;
        }
        .logout-btn {
            color: white;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.9;
        }
        .logout-btn:hover {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="left-panel">
        <div class="logo">
            <img th:src="@{/images/微信图片_20260405124139.png}" alt="Logo" onerror="this.style.display='none'">
            <span>语文魔方</span>
        </div>
        <img th:src="@{/images/微信图片_20260401134532.png}" alt="插图" class="illustration" onerror="this.style.display='none'">
    </div>
    
    <div class="right-panel">
        <div class="header">
            <div class="avatar">
                <img src="/images/微信图片_20260401134545.png" alt="Logo" style="width: 80px; height: 80px; object-fit: contain;">
            </div>
            <h1>语文魔方</h1>
        </div>
        
        <p th:if="${error}" class="error-tip" th:text="${error}"></p>
        <p th:if="${success}" class="success-tip" th:text="${success}"></p>
        
        <form th:action="@{/register}" method="post" id="registerForm" class="scrollable-form">
            <div class="form-item">
                <label>用户名 <span class="required">*</span></label>
                <input type="text" name="username" th:value="${username}" required placeholder="请输入用户名（6-20 位字符）" minlength="3" maxlength="20">
            </div>

            <div class="form-item">
                <label>密码 <span class="required">*</span></label>
                <input type="password" name="password" required placeholder="请输入密码（至少 6 位）" minlength="6">
            </div>

            <div class="form-item">
                <label>确认密码 <span class="required">*</span></label>
                <input type="password" name="confirmPassword" required placeholder="请再次输入密码" minlength="6">
            </div>

            <div class="form-item">
                <label>角色类型 <span class="required">*</span></label>
                <div class="role-selection">
                    <label class="role-option" th:classappend="${role == 'student' || role == null} ? 'selected' : ''">
                        <input type="radio" name="role" value="student" th:checked="${role == 'student' || role == null}" onchange="updateRoleStyle(this)">
                        👨‍ 学生
                    </label>
                    <label class="role-option" th:classappend="${role == 'admin'} ? 'selected' : ''">
                        <input type="radio" name="role" value="admin" th:checked="${role == 'admin'}" onchange="updateRoleStyle(this)">
                        👨‍ 教师
                    </label>
                </div>
            </div>

            <div class="form-row">
                <div class="form-item">
                    <label>班级 ID</label>
                    <input type="text" name="classId" placeholder="例如：1 班、2 班">
                </div>

                <div class="form-item">
                    <label>姓名</label>
                    <input type="text" name="name" placeholder="请输入真实姓名">
                </div>
            </div>

            <div class="form-row">
                <div class="form-item">
                    <label>性别</label>
                    <select name="gender">
                        <option value="">请选择</option>
                        <option value="male">男</option>
                        <option value="female">女</option>
                    </select>
                </div>

                <div class="form-item">
                    <label>年龄</label>
                    <input type="number" name="age" min="10" max="100" placeholder="请输入年龄">
                </div>
            </div>

            <div class="form-item">
                <label>年级</label>
                <input type="text" name="grade" placeholder="例如：初一、初二">
            </div>

            <button type="submit" class="register-btn">立即注册</button>
        </form>
        
        <div class="tip">
            已有账号？<a th:href="@{/login}">去登录</a>
        </div>
    </div>
</div>

<script>
function updateRoleStyle(radio) {
    document.querySelectorAll('.role-option').forEach(function(option) {
        option.classList.remove('selected');
    });
    radio.closest('.role-option').classList.add('selected');
}
</script>
</body>
</html>
