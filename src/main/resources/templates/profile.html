<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>个人资料 - 语文天地</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: linear-gradient(180deg, #e8f4ff 0%, #f5f7fa 100%);
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        .logo img {
            width: 32px;
            height: 32px;
        }
        .nav {
            display: flex;
            gap: 25px;
        }
        .nav a {
            color: white;
            text-decoration: none;
            font-size: 15px;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s;
        }
        .nav a:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .user-info:hover {
            opacity: 0.8;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .username {
            font-size: 14px;
            color: white;
        }
        .logout-btn {
            color: white;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.9;
        }
        .logout-btn:hover {
            opacity: 1;
            text-decoration: underline;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .page-title {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-title::before {
            content: "👤";
            font-size: 28px;
        }
        .page-desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }
        .card-header {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f4ff;
        }
        .card-title {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-title::before {
            font-size: 24px;
        }
        .form-section {
            margin-bottom: 30px;
        }
        .form-section-title {
            color: #667eea;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 2px dashed #f0f4ff;
        }
        .form-section-title::before {
            font-size: 20px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-item {
            margin-bottom: 20px;
        }
        .form-item label {
            display: block;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
        }
        .form-item input, .form-item select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            background-color: white;
        }
        .form-item input:focus, .form-item select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .form-item input[readonly] {
            background-color: #f5f7fa;
            cursor: not-allowed;
            color: #909399;
        }
        .error-tip {
            color: #f56c6c;
            font-size: 14px;
            margin-bottom: 20px;
            padding: 15px 20px;
            background-color: #fef0f0;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid #f56c6c;
            font-weight: 500;
        }
        .success-tip {
            color: #67c23a;
            font-size: 14px;
            margin-bottom: 20px;
            padding: 15px 20px;
            background-color: #f0f9eb;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid #67c23a;
            font-weight: 500;
        }
        .submit-btn {
            padding: 14px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        .current-info {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.02) 0%, rgba(118, 75, 162, 0.02) 100%);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 2px solid #f0f4ff;
        }
        .current-info p {
            color: #606266;
            font-size: 14px;
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .current-info p:last-child {
            margin-bottom: 0;
        }
        .current-info strong {
            color: #2c3e50;
        }
        .role-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-left: 8px;
        }
        .role-badge.admin {
            background: linear-gradient(135deg, rgba(103, 194, 58, 0.1) 0%, rgba(103, 194, 58, 0.2) 100%);
            color: #67c23a;
            border: 2px solid #67c23a;
        }
        .role-badge.student {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(102, 126, 234, 0.2) 100%);
            color: #667eea;
            border: 2px solid #667eea;
        }
        .tip {
            color: #909399;
            font-size: 13px;
            margin-top: 10px;
            line-height: 1.5;
            padding-left: 20px;
            position: relative;
        }
        .tip::before {
            content: "💡";
            position: absolute;
            left: 0;
            top: 0;
        }
        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn-action {
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            display: inline-block;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        .btn-secondary {
            background-color: #f0f2f5;
            color: #606266;
        }
        .btn-secondary:hover {
            background-color: #e4e7ed;
        }
        .btn-success {
            background: linear-gradient(135deg, rgba(103, 194, 58, 0.1) 0%, rgba(103, 194, 58, 0.2) 100%);
            color: #67c23a;
            border: 2px solid #67c23a;
        }
        .btn-success:hover {
            background: linear-gradient(135deg, rgba(103, 194, 58, 0.2) 0%, rgba(103, 194, 58, 0.3) 100%);
        }
    </style>
</head>
<body>
<div class="header">
    <div class="header-left">
        <div class="logo">
            <img th:src="@{/images/微信图片_20260405124109.png}" alt="Logo" onerror="this.style.display='none'">
            <span>语文天地</span>
        </div>
        <div class="nav">
            <a th:href="@{/}">首页</a>
            <th:block th:if="${user != null && user.role != 'admin'}">
                <a th:href="@{/forum}">班级留言板</a>
                <a th:href="@{/energy}">能量监测窗</a>
                <a th:href="@{/questionnaire}">心理问卷评估</a>
                <a th:href="@{/diagnosis/personal}">学情诊断报告</a>
            </th:block>
            <th:block th:if="${user != null && user.role == 'admin'}">
                <a th:href="@{/energy/admin}">课堂数据看板</a>
                <a th:href="@{/forum}">班级留言板</a>
                <a th:href="@{/diagnosis/class}">学情诊断报告</a>
                <a th:href="@{/teaching-resources}">教学资源库</a>
            </th:block>
        </div>
    </div>
    <div class="header-right">
        <div class="user-info" onclick="window.location.href='/profile'">
            <div class="user-avatar">👤</div>
            <span class="username" th:if="${user != null}">
                <span th:if="${user.role == 'admin' && user.name != null}" th:text="'Hi, ' + ${user.name} + '老师'"></span>
                <span th:if="${user.role == 'admin' && user.name == null}" th:text="'Hi, ' + ${user.username} + '老师'"></span>
                <span th:if="${user.role != 'admin' && user.name != null}" th:text="'Hi, ' + ${user.name} + '同学'"></span>
                <span th:if="${user.role != 'admin' && user.name == null}" th:text="'Hi, ' + ${user.username} + '同学'"></span>
            </span>
        </div>
        <a th:href="@{/logout}" class="logout-btn">退出登录</a>
    </div>
</div>

<div class="container">
    <div class="page-title">个人资料</div>
    <div class="page-desc">管理您的个人信息和账户设置</div>

    <div class="card">
        <div class="card-header">
            <div class="card-title">👤 个人资料</div>
        </div>
        
        <p th:if="${error}" class="error-tip" th:text="${error}"></p>
        <p th:if="${success}" class="success-tip" th:text="${success}"></p>
        
        <form th:action="@{/profile}" method="post">
            <!-- 账户信息 -->
            <div class="form-section">
                <div class="form-section-title">🔐 账户信息</div>
                
                <div class="current-info">
                    <p>当前角色：<span class="role-badge" th:classappend="${user.role == 'admin'} ? 'admin' : 'student'">
                        <span th:if="${user.role == 'admin'}">👨‍🏫 教师</span>
                        <span th:if="${user.role != 'admin'}">👨‍🎓 学生</span>
                    </span></p>
                    <p>注册时间：<span th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></span></p>
                </div>
                
                <div class="form-item">
                    <label>🆔 用户名<span style="color: #909399; font-weight: normal; font-size: 12px;">（用于登录和显示）</span></label>
                    <input type="text" name="username" th:value="${user.username}" required placeholder="请输入新的用户名">
                    <p class="tip">修改用户名后，下次登录需使用新用户名</p>
                </div>
            </div>
            
            <!-- 个人信息 -->
            <div class="form-section">
                <div class="form-section-title">📝 个人信息</div>
                
                <div class="form-row">
                    <div class="form-item">
                        <label>📛 真实姓名</label>
                        <input type="text" name="name" th:value="${user.name}" placeholder="请输入真实姓名">
                    </div>
                    
                    <div class="form-item">
                        <label>🎭 性别</label>
                        <select name="gender">
                            <option value="">请选择</option>
                            <option value="male" th:selected="${user.gender == 'male'}">男</option>
                            <option value="female" th:selected="${user.gender == 'female'}">女</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-item">
                        <label>🎂 年龄</label>
                        <input type="number" name="age" th:value="${user.age}" min="10" max="100" placeholder="请输入年龄（可选）">
                    </div>
                    
                    <div class="form-item">
                        <label>📚 年级</label>
                        <select name="grade">
                            <option value="">请选择</option>
                            <option value="初一" th:selected="${user.grade == '初一'}">初一</option>
                            <option value="初二" th:selected="${user.grade == '初二'}">初二</option>
                            <option value="初三" th:selected="${user.grade == '初三'}">初三</option>
                            <option value="高一" th:selected="${user.grade == '高一'}">高一</option>
                            <option value="高二" th:selected="${user.grade == '高二'}">高二</option>
                            <option value="高三" th:selected="${user.grade == '高三'}">高三</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-item">
                    <label>🏫 班级 ID</label>
                    <input type="text" name="classId" th:value="${user.classId}" readonly placeholder="班级 ID 不可修改">
                    <p class="tip">班级 ID 由管理员设置，个人无法修改</p>
                </div>
            </div>
            
            <button type="submit" class="submit-btn">💾 保存修改</button>
        </form>
    </div>
    
    <div class="card">
        <div class="card-header">
            <div class="card-title">🔗 快捷操作</div>
        </div>
        <div class="action-buttons">
            <a th:href="@{/change-password}" class="btn-action btn-success">🔐 修改密码</a>
            <a th:href="@{/}" class="btn-action btn-secondary">← 返回首页</a>
        </div>
    </div>
</div>
</body>
</html>
