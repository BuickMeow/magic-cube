<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${questionnaire.title} + ' - 语文天地'"></title>
    
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="has-sidebar">
<div class="header">
    <div class="header-left">
        <div class="logo">
            <img th:src="@{/images/微信图片_20260405124109.png}" alt="Logo" onerror="this.style.display='none'">
            <span>语文天地</span>
        </div>
        <div class="nav">
            <a th:href="@{/}">首页</a>
            <a th:href="@{/forum}">班级留言板</a>
            <a th:href="@{/energy}">能量监测窗</a>
            <a th:href="@{/questionnaire}" style="background-color: rgba(255, 255, 255, 0.2);">心理问卷评估</a>
            <a th:href="@{/diagnosis/personal}">学情诊断报告</a>
            <a th:href="@{/intervention}">干预记录</a>
        </div>
    </div>
    <div class="header-right">
        <div class="user-info" onclick="window.location.href='/profile'">
            <div class="user-avatar">👤</div>
            <span class="username" th:if="${user != null}">
                <span th:if="${user.role == 'admin' && user.name != null}" th:text="'Hi, ' + ${user.name} + '老师'"></span>
                <span th:if="${user.role == 'admin' && user.name == null}" th:text="'Hi, ' + ${user.username} + '老师'"></span>
                <span th:if="${user.role != 'admin' && user.name != null}" th:text="'Hi, ' + ${user.name} + '同学'"></span>
                <span th:if="${user.role != 'admin' && user.name == null}" th:text="'Hi, ' + ${user.username} + '同学'"></span>
            </span>
        </div>
        <a th:href="@{/logout}" class="logout-btn">退出登录</a>
    </div>
</div>

<div class="container">
    <!-- 基本信息表单区域 -->
    <div class="form-section">
        <div class="form-group">
            <label class="form-label">1. 您的姓名<span class="required">*</span></label>
            <input type="text" name="name" th:value="${user.name}" class="form-input" placeholder="请输入您的姓名" required>
        </div>

        <div class="form-group">
            <label class="form-label">2. 您的性别<span class="required">*</span></label>
            <div class="gender-group">
                <div class="gender-option">
                    <input type="radio" name="gender" id="genderMale" value="male" th:checked="${user.gender == 'male'}">
                    <label for="genderMale">男</label>
                </div>
                <div class="gender-option">
                    <input type="radio" name="gender" id="genderFemale" value="female" th:checked="${user.gender == 'female'}">
                    <label for="genderFemale">女</label>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">3. 您的年龄<span class="required">*</span></label>
            <div class="select-wrapper">
                <select name="age" class="form-input" required>
                    <option value="">请选择</option>
                    <option th:each="i : ${#numbers.sequence(10, 20)}" th:value="${i}" th:text="${i}" th:selected="${user.age == i}"></option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">4. 您的年级<span class="required">*</span></label>
            <div class="select-wrapper">
                <select name="grade" class="form-input" required>
                    <option value="">请选择</option>
                    <option value="初一" th:selected="${user.grade == '初一'}">初一</option>
                    <option value="初二" th:selected="${user.grade == '初二'}">初二</option>
                    <option value="初三" th:selected="${user.grade == '初三'}">初三</option>
                    <option value="高一" th:selected="${user.grade == '高一'}">高一</option>
                    <option value="高二" th:selected="${user.grade == '高二'}">高二</option>
                    <option value="高三" th:selected="${user.grade == '高三'}">高三 </option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">5. 当前状态<span class="required">*</span></label>
            <div class="select-wrapper">
                <select name="interventionStatus" class="form-input" id="interventionStatusSelect" required>
                    <option value="PRE_INTERVENTION" th:selected="${defaultInterventionStatus == 'PRE_INTERVENTION'}">干预前（第一次填写）</option>
                    <option value="POST_INTERVENTION" th:selected="${defaultInterventionStatus == 'POST_INTERVENTION'}">干预后（再次填写）</option>
                </select>
            </div>
            <p class="hint-text">
                <span th:if="${defaultInterventionStatus == 'PRE_INTERVENTION'}">👈 首次填写请选择"干预前"，完成后将跳转查看分数</span>
                <span th:if="${defaultInterventionStatus == 'POST_INTERVENTION'}">👈 已完成干预前评估，请选择"干预后"进行对比</span>
            </p>
        </div>
    </div>

    <!-- 进度条区域 -->
    <div class="progress-container">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">已回答 0 / 25 题</div>
    </div>

    <!-- 问卷题目区域 -->
    <div class="question-section" id="questionSection">
        <form th:action="@{'/questionnaire/submit/' + ${questionnaire.id}}" method="post" id="questionnaireForm">
            <!-- 隐藏字段 -->
            <input type="hidden" name="name" th:value="${user.name}" id="hiddenName">
            <input type="hidden" name="gender" th:value="${user.gender}" id="hiddenGender">
            <input type="hidden" name="age" th:value="${user.age}" id="hiddenAge">
            <input type="hidden" name="grade" th:value="${user.grade}" id="hiddenGrade">
            <input type="hidden" name="interventionStatus" th:value="${defaultInterventionStatus != null ? defaultInterventionStatus : 'PRE_INTERVENTION'}" id="hiddenInterventionStatus">
            
            <div th:each="question, iterStat : ${questionnaire.questions}"
                 class="question-card"
                 th:data-question-id="${question.id}"
                 th:data-dimension="${question.dimension}"
                 th:id="'questionCard_' + ${iterStat.index}">

                <div class="question-item">
                    <div class="question-header">
                        <div class="question-number" th:text="'1. ' + ${iterStat.index + 1}"></div>
                        <div class="question-tag" th:switch="${question.dimension}">
                            <span th:case="'RESILIENCE'">心理弹性</span>
                            <span th:case="*">未知维度</span>
                        </div>
                    </div>

                    <div class="question-text" th:text="${question.content}"></div>

                    <div class="options-group">
                        <div th:each="option : ${question.options}" class="option-item">
                            <input type="radio"
                                   th:name="'question_' + ${question.id}"
                                   th:id="'option_' + ${option.id}"
                                   th:value="${option.scoreValue}"
                                   required>
                            <label th:for="'option_' + ${option.id}">
                                <span class="option-text" th:text="${option.content}"></span>
                                <span class="option-score" th:text="${option.scoreValue} + '分'"></span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="submit-section">
                <button type="submit" class="submit-btn">提交</button>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('questionnaireForm');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const questionCards = document.querySelectorAll('.question-card');
    const totalQuestions = questionCards.length;

    // 为所有单选按钮添加事件监听
    document.querySelectorAll('input[type="radio"]').forEach(radio => {
        radio.addEventListener('change', updateProgress);
    });

    // 更新进度条和已答题高亮
    function updateProgress() {
        const answeredQuestions = document.querySelectorAll('.question-card input[type="radio"]:checked').length;
        const progress = (answeredQuestions / totalQuestions) * 100;
        progressFill.style.width = progress + '%';
        progressText.textContent = `已回答 ${answeredQuestions} / ${totalQuestions} 题`;
        
        // 为已答题的卡片添加高亮样式
        questionCards.forEach((card, index) => {
            const questionId = card.dataset.questionId;
            const isAnswered = document.querySelector(`input[name="question_${questionId}"]:checked`) !== null;
            if (isAnswered) {
                card.classList.add('answered');
            } else {
                card.classList.remove('answered');
            }
        });
    }

    // 初始化进度（从 0 开始）
    updateProgress();

    // 表单提交验证 - 使用 click 事件代替 submit 事件
    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();

        console.log('=== 开始表单验证 ===');

        const nameInput = document.querySelector('input[name="name"]');
        const genderInput = document.querySelector('input[name="gender"]:checked');
        const ageInput = document.querySelector('select[name="age"]');
        const gradeInput = document.querySelector('select[name="grade"]');
        const interventionStatusInput = document.getElementById('interventionStatusSelect');

        const name = nameInput.value;
        const gender = genderInput ? genderInput.value : null;
        const age = ageInput.value;
        const grade = gradeInput.value;
        const interventionStatus = interventionStatusInput.value;

        console.log('基本信息检查:', { name, gender, age, grade, interventionStatus });

        // 检查基本信息是否完整
        if (!name || !gender || !age || !grade || !interventionStatus) {
            // 找到缺失的字段并聚焦
            let missingField = null;
            if (!name) missingField = nameInput;
            else if (!gender) {
                const genderOptions = document.querySelectorAll('input[name="gender"]');
                if (genderOptions.length > 0) {
                    genderOptions[0].parentElement.scrollIntoView({behavior: 'smooth', block: 'center'});
                }
            }
            else if (!age) missingField = ageInput;
            else if (!grade) missingField = gradeInput;
            else if (!interventionStatus) missingField = interventionStatusInput;

            // 滚动到基本信息区域
            const infoSection = document.querySelector('.form-section');
            if (infoSection) {
                infoSection.scrollIntoView({behavior: 'smooth', block: 'start'});
            }

            // 给缺失的字段添加红色边框高亮
            if (missingField) {
                missingField.style.borderColor = '#f56c6c';
                missingField.style.boxShadow = '0 0 0 3px rgba(245, 108, 108, 0.3)';
                missingField.focus();

                // 3 秒后移除高亮
                setTimeout(() => {
                    missingField.style.borderColor = '';
                    missingField.style.boxShadow = '';
                }, 3000);
            }

            setTimeout(function() {
                alert('❗ 请先填写完整的基本信息（姓名、性别、年龄、年级、当前状态）！\n\n已自动定位到缺失的字段。');
            }, 100);

            return false;
        }

        // 检查所有题目是否已回答
        const unanswered = Array.from(questionCards).filter(card => {
            const questionId = card.dataset.questionId;
            const selectedOption = document.querySelector(`input[name="question_${questionId}"]:checked`);
            console.log(`题目 ${questionId}:`, selectedOption ? '已答' : '未答');
            return !selectedOption;
        });

        console.log('未答题目数量:', unanswered.length);

        if (unanswered.length > 0) {
            // 移除之前的高亮
            questionCards.forEach(card => {
                card.classList.remove('unanswered-highlight');
            });

            // 给未回答的题目添加红色高亮和抖动效果
            unanswered.forEach(card => {
                card.classList.add('unanswered-highlight');
            });

            // 滚动到第一个未回答的问题
            unanswered[0].scrollIntoView({behavior: 'smooth', block: 'center'});

            setTimeout(function() {
                alert('❗ 您还有 ' + unanswered.length + ' 道题未回答，请完成所有题目后再提交！\n\n未回答的题目已用红色标出，请尽快完成。');
            }, 100);

            return false;
        }
        
        // 将用户填写的基本信息同步到隐藏字段
        document.getElementById('hiddenName').value = name;
        document.getElementById('hiddenGender').value = gender;
        document.getElementById('hiddenAge').value = age;
        document.getElementById('hiddenGrade').value = grade;
        document.getElementById('hiddenInterventionStatus').value = interventionStatus;
        
        console.log('表单验证通过，正在提交...');
        console.log('提交数据:', {
            name: name,
            gender: gender,
            age: age,
            grade: grade,
            interventionStatus: interventionStatus
        });

        // 显示题目区域
        // document.getElementById('questionSection').style.display = 'block';

        // 滚动到题目区域
        // document.getElementById('questionSection').scrollIntoView({behavior: 'smooth', block: 'start'});

        // 禁用提交按钮，防止重复提交
        this.disabled = true;
        this.textContent = '提交中...';
        this.style.backgroundColor = '#909399';
        this.style.cursor = 'not-allowed';

        // 手动提交表单
        form.submit();
        return true;
    });

    // 当用户选择答案时，移除高亮
    document.querySelectorAll('input[type="radio"]').forEach(radio => {
        radio.addEventListener('change', function() {
            const questionCard = this.closest('.question-card');
            questionCard.classList.remove('unanswered-highlight');
            updateProgress();
        });
    });

});
</script>
