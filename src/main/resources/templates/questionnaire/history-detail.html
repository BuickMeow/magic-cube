<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>问卷详情 - 语文天地</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: linear-gradient(180deg, #e8f4ff 0%, #f5f7fa 100%);
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        .logo img {
            width: 32px;
            height: 32px;
        }
        .nav {
            display: flex;
            gap: 25px;
        }
        .nav a {
            color: white;
            text-decoration: none;
            font-size: 15px;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s;
        }
        .nav a:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .user-info:hover {
            opacity: 0.8;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .username {
            font-size: 14px;
            color: white;
        }
        .logout-btn {
            color: white;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.9;
        }
        .logout-btn:hover {
            opacity: 1;
            text-decoration: underline;
        }
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .page-title {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-title::before {
            content: "📊";
            font-size: 28px;
        }
        .page-desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }
        .card-header {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f4ff;
        }
        .card-title {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-title::before {
            font-size: 24px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .info-item {
            padding: 20px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.02) 0%, rgba(118, 75, 162, 0.02) 100%);
            border-radius: 12px;
            border: 2px solid #f0f4ff;
            transition: all 0.3s;
        }
        .info-item:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }
        .info-item label {
            color: #909399;
            font-size: 13px;
            margin-bottom: 8px;
            display: block;
            font-weight: 500;
        }
        .info-item p {
            color: #2c3e50;
            font-size: 16px;
            font-weight: bold;
            margin: 0;
        }
        .score-display {
            text-align: center;
            padding: 40px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }
        .score-display::before {
            content: "";
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        .score-display .score-number {
            font-size: 64px;
            font-weight: bold;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        .score-display .score-label {
            font-size: 16px;
            opacity: 0.95;
            position: relative;
            z-index: 1;
        }
        .section-subtitle {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-subtitle::before {
            font-size: 22px;
        }
        .question-card {
            background: white;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        .question-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }
        .question-number {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .question-text {
            font-size: 17px;
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: 500;
            line-height: 1.6;
        }
        .options-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }
        .option-label {
            text-align: center;
            padding: 15px 8px;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            font-size: 14px;
            background-color: white;
            color: #606266;
            cursor: pointer;
            transition: all 0.3s;
        }
        .option-label:hover {
            border-color: #667eea;
            background-color: #f8f9fa;
        }
        .option-label.selected {
            border-color: #67c23a;
            background: linear-gradient(135deg, rgba(103, 194, 58, 0.05) 0%, rgba(103, 194, 58, 0.1) 100%);
            color: #67c23a;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(103, 194, 58, 0.2);
        }
        .option-text {
            font-size: 13px;
            margin-bottom: 5px;
            line-height: 1.4;
        }
        .option-score {
            font-size: 11px;
            color: #909399;
        }
        .option-label.selected .option-score {
            color: #67c23a;
        }
        .btn-back {
            display: inline-block;
            padding: 14px 35px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
        }
        .status-badge.pre {
            background-color: #f0f2f5;
            color: #606266;
        }
        .status-badge.post {
            background: linear-gradient(135deg, rgba(103, 194, 58, 0.1) 0%, rgba(103, 194, 58, 0.2) 100%);
            color: #67c23a;
        }
        .gender-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
        }
        .gender-badge.male {
            background-color: #e3f2fd;
            color: #1976d2;
        }
        .gender-badge.female {
            background-color: #fce4ec;
            color: #c2185b;
        }
    </style>
</head>
<body>
<div class="header">
    <div class="header-left">
        <div class="logo">
            <img th:src="@{/images/微信图片_20260405124109.png}" alt="Logo" onerror="this.style.display='none'">
            <span>语文天地</span>
        </div>
        <div class="nav">
            <a th:href="@{/}">首页</a>
            <th:block th:if="${user != null && user.role != 'admin'}">
                <a th:href="@{/forum}">班级留言板</a>
                <a th:href="@{/energy}">能量监测窗</a>
                <a th:href="@{/questionnaire}">心理问卷评估</a>
                <a th:href="@{/diagnosis/personal}">学情诊断报告</a>
            </th:block>
            <th:block th:if="${user != null && user.role == 'admin'}">
                <a th:href="@{/energy/admin}">课堂数据看板</a>
                <a th:href="@{/forum}">班级留言板</a>
                <a th:href="@{/diagnosis/class}">学情诊断报告</a>
                <a th:href="@{/teaching-resources}">教学资源库</a>
            </th:block>
        </div>
    </div>
    <div class="header-right">
        <div class="user-info" onclick="window.location.href='/profile'">
            <div class="user-avatar">👤</div>
            <span class="username" th:if="${user != null}">
                <span th:if="${user.role == 'admin' && user.name != null}" th:text="'Hi, ' + ${user.name} + '老师'"></span>
                <span th:if="${user.role == 'admin' && user.name == null}" th:text="'Hi, ' + ${user.username} + '老师'"></span>
                <span th:if="${user.role != 'admin' && user.name != null}" th:text="'Hi, ' + ${user.name} + '同学'"></span>
                <span th:if="${user.role != 'admin' && user.name == null}" th:text="'Hi, ' + ${user.username} + '同学'"></span>
            </span>
        </div>
        <a th:href="@{/logout}" class="logout-btn">退出登录</a>
    </div>
</div>

<div class="container">
    <div class="page-title">问卷详情</div>
    <div class="page-desc">查看本次心理问卷评估的详细信息和答题情况</div>

    <div class="card">
        <div class="card-header">
            <div class="card-title">📋 基本信息</div>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <label>填写时间</label>
                <p th:text="${#temporals.format(detail.data.createdAt, 'yyyy-MM-dd HH:mm')}"></p>
            </div>
            <div class="info-item">
                <label>干预状态</label>
                <p>
                    <span class="status-badge pre" th:if="${detail.data.interventionStatus == 'PRE_INTERVENTION'}">干预前</span>
                    <span class="status-badge post" th:if="${detail.data.interventionStatus == 'POST_INTERVENTION'}">干预后</span>
                </p>
            </div>
            <div class="info-item">
                <label>姓名</label>
                <p th:text="${detail.data.studentName}"></p>
            </div>
            <div class="info-item">
                <label>性别</label>
                <p>
                    <span class="gender-badge male" th:if="${detail.data.studentGender == 'male'}">男</span>
                    <span class="gender-badge female" th:if="${detail.data.studentGender == 'female'}">女</span>
                </p>
            </div>
            <div class="info-item">
                <label>年龄</label>
                <p th:text="${detail.data.studentAge} + '岁'"></p>
            </div>
            <div class="info-item">
                <label>年级</label>
                <p th:text="${detail.data.studentGrade}"></p>
            </div>
        </div>

        <div class="score-display">
            <div class="score-number" th:text="${detail.data.cdRiscScore}"></div>
            <div class="score-label">心理弹性总分（满分 100 分）</div>
        </div>

        <h3 class="section-subtitle">📝 答题详情</h3>

        <div th:each="question, iterStat : ${detail.questions}" class="question-card">
            <div class="question-number" th:text="'第' + ${iterStat.index + 1} + '题'"></div>
            <div class="question-text" th:text="${question.content}"></div>

            <div class="options-container">
                <div th:each="option : ${question.options}"
                     class="option-label"
                     th:classappend="${detail.userAnswers[question.id] != null && detail.userAnswers[question.id] == option.scoreValue} ? 'selected'">
                    <div class="option-text" th:text="${option.content}"></div>
                    <div class="option-score" th:text="${option.scoreValue} + '分'"></div>
                </div>
            </div>
        </div>

        <div style="text-align: center; margin-top: 30px; padding-top: 30px; border-top: 2px solid #f0f4ff;">
            <a th:if="${user != null && user.role == 'admin'}" th:href="@{/diagnosis/class}" class="btn-back">← 返回全班学情诊断报告</a>
            <a th:unless="${user != null && user.role == 'admin'}" th:href="@{/diagnosis/personal}" class="btn-back">← 返回个人学情诊断报告</a>
        </div>
    </div>
</div>
</body>
</html>
