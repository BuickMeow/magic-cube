<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>忘记密码 - 语文魔方</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: url("/images/微信图片_20260401134509.png")no-repeat center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            display: flex;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 1100px;
            width: 100%;
            min-height: 650px;
            position: relative;
        }
        .logo-text {
            position: absolute;
            top: 30px;
            left: 40px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 26px;
            font-weight: bold;
            color: #4a5568;
        }
        .logo-img {
            width: 42px;
            height: 42px;
        }
        .illustration-side {
            flex: 1.1;
            padding: 80px 40px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .illustration-img {
            max-width: 90%;
            height: auto;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.2));
        }
        .forgot-side {
            flex: 0.9;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .forgot-box {
            width: 100%;
            max-width: 340px;
            margin: 0 auto;
        }
        .avatar-circle {
            width: 80px;
            height: 80px;
            background: #f0f0f0;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        .forgot-box h1 {
            text-align: center;
            color: #6b73ff;
            margin-bottom: 10px;
            font-size: 24px;
            font-weight: bold;
        }
        .forgot-box p {
            text-align: center;
            color: #909399;
            margin-bottom: 25px;
            font-size: 13px;
        }
        .form-item {
            margin-bottom: 18px;
        }
        .form-item label {
            display: block;
            color: #606266;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
        }
        .form-item input[type="text"],
        .form-item input[type="password"] {
            width: 100%;
            padding: 11px 18px;
            border: 2px solid #e8e8e8;
            border-radius: 50px;
            font-size: 13px;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        .form-item input[type="text"]:focus,
        .form-item input[type="password"]:focus {
            outline: none;
            border-color: #6b73ff;
            background: white;
            box-shadow: 0 0 0 3px rgba(107, 115, 255, 0.1);
        }
        .form-item input::placeholder {
            color: #a0a0a0;
        }
        .error-tip {
            background-color: #fef0f0;
            color: #f56c6c;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
            border-left: 3px solid #f56c6c;
        }
        .success-tip {
            background-color: #f0f9ff;
            color: #67c23a;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
            border-left: 3px solid #67c23a;
        }
        .submit-btn {
            width: 100%;
            padding: 11px;
            background: #e8eef5;
            color: #999999;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 6px;
        }
        .submit-btn:hover {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
            transform: translateY(-1px);
        }
        .tip {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #606266;
        }
        .tip a {
            color: #6b73ff;
            text-decoration: none;
            font-weight: 600;
            margin-left: 3px;
            transition: color 0.3s ease;
        }
        .tip a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .user-info:hover {
            opacity: 0.8;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .username {
            font-size: 14px;
            color: white;
        }
        .logout-btn {
            color: white;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.9;
        }
        .logout-btn:hover {
            opacity: 1;
            text-decoration: underline;
        }
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                max-width: 500px;
            }
            .logo-text {
                top: 20px;
                left: 20px;
                font-size: 24px;
            }
            .illustration-side {
                padding: 40px 20px;
            }
            .forgot-side {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo-text">
        <img src="/images/微信图片_20260401134545.png" alt="Logo" class="logo-img">
        语文魔方
    </div>

    <div class="illustration-side">
        <img src="/images/微信图片_20260401134532.png" alt="插图" class="illustration-img">
    </div>

    <div class="forgot-side">
        <div class="forgot-box">
            <div class="avatar-circle">📝</div>
            <h1>忘记密码</h1>

            <p th:if="${error}" class="error-tip" th:text="${error}"></p>
            <p th:if="${success}" class="success-tip" th:text="${success}"></p>

            <form th:action="@{/forgot-password}" method="post">
                <div class="form-item">
                    <input type="text" name="username" required placeholder="请输入您的用户名">
                </div>

                <div class="form-item">
                    <input type="password" name="newPassword" required placeholder="请输入新密码（至少 6 位）" minlength="6">
                </div>

                <div class="form-item">
                    <input type="password" name="confirmPassword" required placeholder="请再次输入新密码" minlength="6">
                </div>

                <button type="submit" class="submit-btn">确认修改密码</button>
            </form>

            <div class="tip">
                记得密码了？<a th:href="@{/login}">去登录</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
