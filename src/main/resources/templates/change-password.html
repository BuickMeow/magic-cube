<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>修改密码 - 语文魔方</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: url("/images/微信图片_20260401134509.png")no-repeat center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            display: flex;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 1200px;
            width: 100%;
            min-height: 700px;
        }
        .illustration-side {
            flex: 1;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .logo-text {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: bold;
            color: #4a5568;
        }
        .logo-img {
            width: 45px;
            height: 45px;
        }
        .illustration-img {
            max-width: 100%;
            height: auto;
            flex: 1;
            object-fit: contain;
        }
        .form-side {
            flex: 1;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: white;
        }
        .form-box {
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
        }
        .avatar-circle {
            width: 80px;
            height: 80px;
            background: #f0f0f0;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        .form-box h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 35px;
            font-size: 28px;
            font-weight: bold;
        }
        .form-item {
            margin-bottom: 20px;
        }
        .form-item label {
            display: block;
            color: #606266;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }
        .form-item input {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        .form-item input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .form-item input::placeholder {
            color: #a0a0a0;
        }
        .error-tip {
            background-color: #fef0f0;
            color: #f56c6c;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 25px;
            text-align: center;
            border-left: 4px solid #f56c6c;
        }
        .success-tip {
            background-color: #f0f9eb;
            color: #67c23a;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 25px;
            text-align: center;
            border-left: 4px solid #67c23a;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #e8eef5;
            color: #667eea;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .submit-btn:hover {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
            transform: translateY(-2px);
        }
        .tip {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #606266;
        }
        .tip a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
            margin: 0 8px;
        }
        .tip a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        .tip .separator {
            color: #dcdfe6;
            margin: 0 8px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .user-info:hover {
            opacity: 0.8;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .username {
            font-size: 14px;
            color: white;
        }
        .logout-btn {
            color: white;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.9;
        }
        .logout-btn:hover {
            opacity: 1;
            text-decoration: underline;
        }
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                max-width: 500px;
            }
            .illustration-side {
                padding: 40px 20px;
            }
            .form-side {
                padding: 40px 30px;
            }
            .logo-text {
                top: 20px;
                left: 20px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="illustration-side">
        <div class="logo-text">
            <img src="/images/微信图片_20260401134545.png" alt="Logo" class="logo-img">
            语文魔方
        </div>
        <img src="/images/微信图片_20260401134532.png" alt="插图" class="illustration-img">
    </div>

    <div class="form-side">
        <div class="form-box">
            <div class="avatar-circle">🔐</div>
            <h1>修改密码</h1>

            <p th:if="${error}" class="error-tip" th:text="${error}"></p>
            <p th:if="${success}" class="success-tip" th:text="${success}"></p>

            <form th:action="@{/change-password}" method="post">
                <div class="form-item">
                    <input type="password" name="oldPassword" required placeholder="请输入当前密码">
                </div>

                <div class="form-item">
                    <input type="password" name="newPassword" required placeholder="请输入新密码（至少 6 位）" minlength="6">
                </div>

                <div class="form-item">
                    <input type="password" name="confirmNewPassword" required placeholder="请再次输入新密码" minlength="6">
                </div>

                <button type="submit" class="submit-btn">确认修改</button>
            </form>

            <div class="tip">
                <a th:href="@{/}">← 返回首页</a>
                <span class="separator">|</span>
                <a th:href="@{/profile}">个人资料</a>
            </div>
        </div>
    </div>
</div>
<div class="header-right">
    <div class="user-info" onclick="window.location.href='/profile'">
        <div class="user-avatar">👤</div>
        <span class="username" th:if="${user != null}">
            <span th:if="${user.role == 'admin' && user.name != null}" th:text="'Hi, ' + ${user.name} + '老师'"></span>
            <span th:if="${user.role == 'admin' && user.name == null}" th:text="'Hi, ' + ${user.username} + '老师'"></span>
            <span th:if="${user.role != 'admin' && user.name != null}" th:text="'Hi, ' + ${user.name} + '同学'"></span>
            <span th:if="${user.role != 'admin' && user.name == null}" th:text="'Hi, ' + ${user.username} + '同学'"></span>
        </span>
    </div>
    <a th:href="@{/logout}" class="logout-btn">退出登录</a>
</div>

</body>
</html>
