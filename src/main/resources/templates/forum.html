<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>班级留言板 - 语文天地</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="has-sidebar">

<div class="header">
    <div class="header-left">
        <div class="logo">
            <img th:src="@{/images/微信图片_20260405124109.png}" alt="Logo" onerror="this.style.display='none'">
            <span>语文天地</span>
        </div>
        <div class="nav">
            <a th:href="@{/}">首页</a>
            <th:block th:if="${user != null && user.role != 'admin'}">
                <a th:href="@{/forum}" style="background-color: rgba(255, 255, 255, 0.2);">班级留言板</a>
                <a th:href="@{/energy}">能量检测窗</a>
                <a th:href="@{/questionnaire}">心理问卷评估</a>
                <a th:href="@{/diagnosis/personal}">学情诊断报告</a>
                <a th:href="@{/intervention}">干预记录</a>
            </th:block>
            <th:block th:if="${user != null && user.role == 'admin'}">
                <a th:href="@{/energy/admin}">课堂数据看板</a>
                <a th:href="@{/forum}" style="background-color: rgba(255, 255, 255, 0.2);">班级留言板</a>
                <a th:href="@{/diagnosis/class}">学情诊断报告</a>
                <a th:href="@{/teaching-resources}">教学资源库</a>
                <a th:href="@{/intervention}">干预记录</a>
            </th:block>
        </div>
    </div>
    <div class="header-right">
        <div class="user-info" onclick="window.location.href='/profile'">
            <div class="user-avatar">👤</div>
            <span class="username" th:if="${user != null}">
                <span th:if="${user.role == 'admin' && user.name != null}" th:text="'Hi, ' + ${user.name} + '老师'"></span>
                <span th:if="${user.role == 'admin' && user.name == null}" th:text="'Hi, ' + ${user.username} + '老师'"></span>
                <span th:if="${user.role != 'admin' && user.name != null}" th:text="'Hi, ' + ${user.name} + '同学'"></span>
                <span th:if="${user.role != 'admin' && user.name == null}" th:text="'Hi, ' + ${user.username} + '同学'"></span>
            </span>
        </div>
        <a th:href="@{/logout}" class="logout-btn">退出登录</a>
    </div>
</div>

<div class="container">
    <div class="sort-bar">
        <span class="sort-title">📋 排序方式：</span>
        <div class="sort-options">
            <a th:href="@{/forum(sortBy='time')}" class="sort-btn" th:classappend="${currentSort == 'time'} ? 'active' : ''">🕐 按时间</a>
            <a th:href="@{/forum(sortBy='likes')}" class="sort-btn" th:classappend="${currentSort == 'likes'} ? 'active' : ''">❤️ 按点赞数</a>
            <a th:href="@{/forum(sortBy='comments')}" class="sort-btn" th:classappend="${currentSort == 'comments'} ? 'active' : ''">💬 按评论数</a>
        </div>
    </div>

    <div class="publish-box">
        <form th:action="@{/forum/post}" method="post">
            <textarea name="content" id="postContent" placeholder="分享你的想法..." required></textarea>
            <div class="publish-footer">
                <div class="emoji-wrapper">
                    <button type="button" class="emoji-btn" onclick="toggleEmojiPicker('post')">😀</button>
                    <div class="emoji-picker" id="emojiPicker-post">
                        <span class="emoji-item" onclick="insertEmoji('post', '😄')"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f604.png" alt="😄"></span>
                        <span class="emoji-item" onclick="insertEmoji('post', '😊')"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f60a.png" alt="😊"></span>
                        <span class="emoji-item" onclick="insertEmoji('post', '😂')"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f602.png" alt="😂"></span>
                        <span class="emoji-item" onclick="insertEmoji('post', '🥰')"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f970.png" alt="🥰"></span>
                        <span class="emoji-item" onclick="insertEmoji('post', '😍')"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f60d.png" alt="😍"></span>
                        <span class="emoji-item" onclick="insertEmoji('post', '🤔')"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f914.png" alt="🤔"></span>
                        <span class="emoji-item" onclick="insertEmoji('post', '👍')"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f44d.png" alt="👍"></span>
                        <span class="emoji-item" onclick="insertEmoji('post', '👏')"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f44f.png" alt="👏"></span>
                        <span class="emoji-item" onclick="insertEmoji('post', '💪')"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f4aa.png" alt="💪"></span>
                        <span class="emoji-item" onclick="insertEmoji('post', '❤️')"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/2764.png" alt="❤️"></span>
                        <span class="emoji-item" onclick="insertEmoji('post', '🎉')"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f389.png" alt="🎉"></span>
                        <span class="emoji-item" onclick="insertEmoji('post', '✨')"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/2728.png" alt="✨"></span>
                        <span class="emoji-item" onclick="insertEmoji('post', '🌟')"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f31f.png" alt="🌟"></span>
                        <span class="emoji-item" onclick="insertEmoji('post', '🔥')"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f525.png" alt="🔥"></span>
                        <span class="emoji-item" onclick="insertEmoji('post', '😭')"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f62d.png" alt="😭"></span>
                        <span class="emoji-item" onclick="insertEmoji('post', '😢')"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f622.png" alt="😢"></span>
                    </div>
                </div>
                <button type="submit" class="publish-btn">发表</button>
            </div>
        </form>
    </div>

    <div th:each="post : ${posts}">
        <div class="post-item" th:id="'post-' + ${post.id}">
            <div class="post-header">
                <span class="post-user" th:classappend="${post.role == 'admin' ? 'admin-user' : ''}">
                    <span th:if="${post.role == 'admin'}">👨‍ </span>
                    <span th:text="${post.username}"></span>
                    <span th:if="${post.isPinned}" style="color: #e6a23c; margin-left: 8px; font-size: 12px; background: #fdf6ec; padding: 2px 6px; border-radius: 4px; border: 1px solid #faecd8;">📌 置顶</span>
                </span>
                <span class="post-time" th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
            </div>
            <div class="post-content" th:text="${post.content}"></div>
            <div class="post-actions">
                <button class="action-btn like-btn" th:data-post-id="${post.id}"
                        th:classappend="${post.likedByCurrentUser} ? 'liked' : ''"
                        th:title="${#strings.isEmpty(post.likedUsersStr) ? '暂无点赞' : '点赞用户：' + post.likedUsersStr}">
                    <span th:text="${post.likedByCurrentUser} ? '❤️' : '🤍'"></span>
                    <span class="like-count" th:text="${post.likes}">0</span>
                </button>
                <button class="action-btn comment-btn" onclick="toggleCommentBox(this)">
                    💬 评论
                </button>

                <a th:if="${user != null && user.role == 'admin'}"
                   th:href="@{/forum/pin/{id}(id=${post.id})}"
                   class="pin-btn">
                    <span th:text="${post.isPinned} ? '取消置顶' : '置顶'"></span>
                </a>

                <a th:if="${user != null && ((user.id == post.userId) || (user.role == 'admin' && post.role != 'admin'))}"
                   th:href="@{/forum/delete/{id}(id=${post.id})}"
                   class="delete-btn"
                   th:style="${user != null && user.role == 'admin'} ? 'margin-left: 15px;' : 'margin-left: auto;'"
                   onclick="return confirm('确定要删除这条留言吗？')">删除</a>
            </div>

            <div class="comment-section" id="comment-section-${post.id}">
                <div class="comment-list">
                    <div th:each="comment : ${post.comments}">
                        <div class="comment-item">
                            <div class="comment-header">
                                <span class="comment-user" th:classappend="${comment.role == 'admin' ? 'admin-user' : ''}">
                                    <span th:if="${comment.role == 'admin'}">👨‍ </span>
                                    <span th:text="${comment.username}"></span>
                                    <span th:if="${comment.userId == post.userId}" style="color: #67c23a; font-size: 12px; margin-left: 5px;">（作者）</span>
                                </span>
                                <span class="comment-time" th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                            </div>
                            <div class="comment-content" th:text="${comment.content}"></div>
                            <div class="comment-footer">
                                <button class="action-btn like-btn comment-like-btn" th:data-comment-id="${comment.id}"
                                        th:classappend="${comment.likedByCurrentUser} ? 'liked' : ''"
                                        th:title="${#strings.isEmpty(comment.likedUsersStr) ? '暂无点赞' : '点赞用户：' + comment.likedUsersStr}"
                                        style="padding: 3px 8px; font-size: 12px;">
                                    <span th:text="${comment.likedByCurrentUser} ? '❤️' : '🤍'"></span>
                                    <span class="like-count" th:text="${comment.likes}">0</span>
                                </button>
                                <button class="action-btn reply-btn"
                                        th:data-comment-id="${comment.id}"
                                        th:data-post-id="${post.id}"
                                        th:data-username="${comment.username}"
                                        style="padding: 3px 8px; font-size: 12px;">
                                    💬 回复
                                </button>
                                <a th:if="${user != null && ((user.id == comment.userId) || (user.id == post.userId) || (user.role == 'admin' && comment.role != 'admin'))}"
                                   th:href="@{/forum/delete-comment/{id}(id=${comment.id})}"
                                   class="delete-btn"
                                   th:onclick="return confirm('确定要删除这条评论吗？\n\n注意：删除后将同时删除该评论下的所有回复，且无法恢复！')"
                                   style="font-size: 12px;">删除</a>
                            </div>

                            <div th:if="${comment.comments != null and !#lists.isEmpty(comment.comments)}"
                                 style="margin-top: 10px; padding-left: 20px; border-left: 2px solid #f0f2f5;">
                                <div th:each="reply : ${comment.comments}" class="reply-item" style="padding: 8px 12px; margin-bottom: 8px; background-color: #fafafa; border-radius: 6px;">
                                    <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                                        <span class="comment-user" th:classappend="${reply.role == 'admin' ? 'admin-user' : ''}" style="font-size: 13px;">
                                            <span th:if="${reply.role == 'admin'}">👨‍🏫 </span>
                                            <span th:text="${reply.username}"></span>
                                            <span th:if="${reply.userId == post.userId}" style="color: #67c23a; font-size: 12px; margin-left: 5px;">（作者）</span>
                                            <span th:if="${reply.parentUsername != null}" style="color: #909399; margin-left: 5px;">
                                                回复 <span th:text="'@' + ${reply.parentUsername}"></span>
                                            </span>
                                        </span>
                                        <span class="comment-time" th:if="${reply.createdAt != null}" th:text="${#temporals.format(reply.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                                        <span class="comment-time" th:unless="${reply.createdAt != null}" style="color: #909399; font-size: 12px;">刚刚</span>
                                    </div>
                                    <div class="comment-content" th:text="${reply.content}" style="font-size: 14px;"></div>
                                    <div class="comment-actions">
                                        <button class="action-btn like-btn comment-like-btn" th:data-comment-id="${reply.id}"
                                                th:classappend="${reply.likedByCurrentUser} ? 'liked' : ''"
                                                th:title="${#strings.isEmpty(reply.likedUsersStr) ? '暂无点赞' : '点赞用户：' + reply.likedUsersStr}"
                                                style="padding: 2px 6px; font-size: 11px;">
                                            <span th:text="${reply.likedByCurrentUser} ? '❤️' : '🤍'"></span>
                                            <span class="like-count" th:text="${reply.likes}">0</span>
                                        </button>
                                        <button class="action-btn reply-btn"
                                                th:data-comment-id="${reply.id}"
                                                th:data-post-id="${post.id}"
                                                th:data-username="${reply.username}"
                                                style="padding: 2px 6px; font-size: 11px;">
                                            💬 回复
                                        </button>
                                        <a th:if="${user != null && ((user.id == reply.userId) || (user.id == post.userId) || (user.role == 'admin' && reply.role != 'admin'))}"
                                           th:href="@{/forum/delete-comment/{id}(id=${reply.id})}"
                                           class="delete-btn"
                                           th:onclick="return confirm('确定要删除这条回复吗？\n\n删除后无法恢复！')"
                                           style="font-size: 11px;">删除</a>
                                    </div>
                                </div>
                            </div>

                            <div th:id="'reply-box-' + ${comment.id}" class="reply-input-box" style="display: none;">
                                <form th:action="@{/forum/reply/{id}(id=${post.id})}" method="post" class="reply-form">
                                    <input type="hidden" name="parentId" th:value="${comment.id}">
                                    <div class="reply-input-wrapper">
                                        <input type="text" name="content" th:id="'reply-input-' + ${comment.id}" placeholder="写下你的回复..." required>
                                        <div class="emoji-wrapper">
                                            <button type="button" class="emoji-btn" th:onclick="|toggleEmojiPicker('reply-${comment.id}')|" style="font-size: 18px; padding: 3px;">😀</button>
                                            <div class="emoji-picker comment-picker" th:id="'emojiPicker-reply-' + ${comment.id}">
                                                <span class="emoji-item" th:onclick="|insertEmoji('reply-${comment.id}', '😄')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f604.png" alt="😄"></span>
                                                <span class="emoji-item" th:onclick="|insertEmoji('reply-${comment.id}', '😊')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f60a.png" alt="😊"></span>
                                                <span class="emoji-item" th:onclick="|insertEmoji('reply-${comment.id}', '😂')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f602.png" alt="😂"></span>
                                                <span class="emoji-item" th:onclick="|insertEmoji('reply-${comment.id}', '🥰')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f970.png" alt="🥰"></span>
                                                <span class="emoji-item" th:onclick="|insertEmoji('reply-${comment.id}', '😍')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f60d.png" alt="😍"></span>
                                                <span class="emoji-item" th:onclick="|insertEmoji('reply-${comment.id}', '🤔')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f914.png" alt="🤔"></span>
                                                <span class="emoji-item" th:onclick="|insertEmoji('reply-${comment.id}', '👍')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f44d.png" alt="👍"></span>
                                                <span class="emoji-item" th:onclick="|insertEmoji('reply-${comment.id}', '👏')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f44f.png" alt="👏"></span>
                                                <span class="emoji-item" th:onclick="|insertEmoji('reply-${comment.id}', '💪')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f4aa.png" alt="💪"></span>
                                                <span class="emoji-item" th:onclick="|insertEmoji('reply-${comment.id}', '❤️')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/2764.png" alt="❤️"></span>
                                                <span class="emoji-item" th:onclick="|insertEmoji('reply-${comment.id}', '🎉')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f389.png" alt="🎉"></span>
                                                <span class="emoji-item" th:onclick="|insertEmoji('reply-${comment.id}', '✨')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/2728.png" alt="✨"></span>
                                                <span class="emoji-item" th:onclick="|insertEmoji('reply-${comment.id}', '🌟')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f31f.png" alt="🌟"></span>
                                                <span class="emoji-item" th:onclick="|insertEmoji('reply-${comment.id}', '🔥')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f525.png" alt="🔥"></span>
                                                <span class="emoji-item" th:onclick="|insertEmoji('reply-${comment.id}', '😭')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f62d.png" alt="😭"></span>
                                                <span class="emoji-item" th:onclick="|insertEmoji('reply-${comment.id}', '😢')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f622.png" alt="😢"></span>
                                            </div>
                                        </div>
                                    </div>
                                    <button type="submit" class="comment-submit" style="padding: 6px 15px; font-size: 13px;">发表</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <form class="comment-box" th:action="@{/forum/comment/{id}(id=${post.id})}" method="post">
                        <div class="comment-box-input-wrapper">
                            <input type="text" name="content" th:id="'comment-input-' + ${post.id}" placeholder="写下你的评论..." required>
                            <div class="emoji-wrapper">
                                <button type="button" class="emoji-btn" th:onclick="|toggleEmojiPicker('comment-${post.id}')|" style="font-size: 18px; padding: 3px;">😀</button>
                                <div class="emoji-picker comment-picker" th:id="'emojiPicker-comment-' + ${post.id}">
                                    <span class="emoji-item" th:onclick="|insertEmoji('comment-${post.id}', '😄')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f604.png" alt="😄"></span>
                                    <span class="emoji-item" th:onclick="|insertEmoji('comment-${post.id}', '😊')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f60a.png" alt="😊"></span>
                                    <span class="emoji-item" th:onclick="|insertEmoji('comment-${post.id}', '😂')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f602.png" alt="😂"></span>
                                    <span class="emoji-item" th:onclick="|insertEmoji('comment-${post.id}', '🥰')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f970.png" alt="🥰"></span>
                                    <span class="emoji-item" th:onclick="|insertEmoji('comment-${post.id}', '😍')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f60d.png" alt="😍"></span>
                                    <span class="emoji-item" th:onclick="|insertEmoji('comment-${post.id}', '🤔')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f914.png" alt="🤔"></span>
                                    <span class="emoji-item" th:onclick="|insertEmoji('comment-${post.id}', '👍')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f44d.png" alt="👍"></span>
                                    <span class="emoji-item" th:onclick="|insertEmoji('comment-${post.id}', '👏')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f44f.png" alt="👏"></span>
                                    <span class="emoji-item" th:onclick="|insertEmoji('comment-${post.id}', '💪')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f4aa.png" alt="💪"></span>
                                    <span class="emoji-item" th:onclick="|insertEmoji('comment-${post.id}', '❤️')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/2764.png" alt="❤️"></span>
                                    <span class="emoji-item" th:onclick="|insertEmoji('comment-${post.id}', '🎉')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f389.png" alt="🎉"></span>
                                    <span class="emoji-item" th:onclick="|insertEmoji('comment-${post.id}', '✨')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/2728.png" alt="✨"></span>
                                    <span class="emoji-item" th:onclick="|insertEmoji('comment-${post.id}', '🌟')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f31f.png" alt="🌟"></span>
                                    <span class="emoji-item" th:onclick="|insertEmoji('comment-${post.id}', '🔥')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f525.png" alt="🔥"></span>
                                    <span class="emoji-item" th:onclick="|insertEmoji('comment-${post.id}', '😭')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f62d.png" alt="😭"></span>
                                    <span class="emoji-item" th:onclick="|insertEmoji('comment-${post.id}', '😢')|"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f622.png" alt="😢"></span>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="comment-submit">发表</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function scrollToPost() {
        var hash = window.location.hash;
        if (hash && hash.startsWith('#post-')) {
            var postId = hash.replace('#post-', '');
            var targetElement = document.getElementById('post-' + postId);
            if (targetElement) {
                setTimeout(function() {
                    var headerOffset = 80;
                    var elementPosition = targetElement.getBoundingClientRect().top;
                    var offsetPosition = elementPosition + window.pageYOffset - headerOffset;

                    window.scrollTo({
                        top: offsetPosition,
                        behavior: 'smooth'
                    });

                    targetElement.style.transition = 'background-color 0.5s ease';
                    targetElement.style.backgroundColor = '#fff7e6';
                    setTimeout(function() {
                        targetElement.style.backgroundColor = 'white';
                    }, 1500);
                }, 300);
            }
        }
    }

    window.addEventListener('DOMContentLoaded', scrollToPost);
    window.addEventListener('hashchange', scrollToPost);

    function toggleEmojiPicker(type) {
        const pickerId = 'emojiPicker-' + type;
        const picker = document.getElementById(pickerId);

        if (!picker) return;

        // 关闭其他所有表情选择器
        document.querySelectorAll('.emoji-picker').forEach(p => {
            if (p.id !== pickerId) {
                p.classList.remove('show');
            }
        });

        picker.classList.toggle('show');
    }

    function insertEmoji(type, emoji) {
        let input;
        if (type === 'post') {
            input = document.getElementById('postContent');
        } else if (type.startsWith('comment-')) {
            const postId = type.replace('comment-', '');
            input = document.getElementById('comment-input-' + postId);
        } else if (type.startsWith('reply-')) {
            const commentId = type.replace('reply-', '');
            input = document.getElementById('reply-input-' + commentId);
        }

        if (input) {
            input.value += emoji;
            input.focus();
        }

        // 关闭表情选择器
        const pickerId = 'emojiPicker-' + type;
        const picker = document.getElementById(pickerId);
        if (picker) {
            picker.classList.remove('show');
        }
    }

    function toggleCommentBox(btn) {
        const postItem = btn.closest('.post-item');
        const commentSection = postItem.querySelector('.comment-section');
        const isHidden = commentSection.style.display === 'none';

        postItem.querySelectorAll('.comment-section').forEach(section => {
            section.style.display = 'none';
        });

        if (isHidden) {
            commentSection.style.display = 'block';
        }
    }

    $(function() {
        $(".like-btn:not(.comment-like-btn)").click(function() {
            var $btn = $(this);
            var postId = $btn.data("post-id");

            $.ajax({
                url: "/forum/like/" + postId,
                type: "POST",
                contentType: "application/json",
                success: function(data) {
                    if (data.success) {
                        var titleText = data.likedUsersStr ? '点赞用户：' + data.likedUsersStr : '暂无点赞';
                        $btn.attr('title', titleText);

                        if (data.liked) {
                            $btn.addClass("liked");
                            $btn.html('<span style="color: #f56c6c;">❤️</span> <span class="like-count">' + data.likes + '</span>');
                        } else {
                            $btn.removeClass("liked");
                            $btn.html('<span style="color: #999;">🤍</span> <span class="like-count">' + data.likes + '</span>');
                        }
                    } else {
                        alert(data.message || "点赞失败");
                    }
                },
                error: function() {
                    alert("点赞失败，请重试");
                }
            });
        });

        $(".comment-like-btn").click(function(e) {
            e.stopPropagation();
            var $btn = $(this);
            var commentId = $btn.data("comment-id");

            $.ajax({
                url: "/forum/comment-like/" + commentId,
                type: "POST",
                contentType: "application/json",
                success: function(data) {
                    if (data.success) {
                        var titleText = data.likedUsersStr ? '点赞用户：' + data.likedUsersStr : '暂无点赞';
                        $btn.attr('title', titleText);

                        if (data.liked) {
                            $btn.addClass("liked");
                            $btn.html('<span style="color: #f56c6c;">❤️</span> <span class="like-count">' + data.likes + '</span>');
                        } else {
                            $btn.removeClass("liked");
                            $btn.html('<span style="color: #999;">🤍</span> <span class="like-count">' + data.likes + '</span>');
                        }
                    } else {
                        alert(data.message || "点赞失败");
                    }
                },
                error: function() {
                    alert("点赞失败，请重试");
                }
            });
        });

        $(document).on("click", ".reply-btn", function() {
            var $btn = $(this);
            var clickedCommentId = $btn.data("comment-id");
            var clickedUsername = $btn.data("username");

            var $parentCommentItem = $btn.closest(".comment-item");
            var topLevelCommentId = $parentCommentItem.find("> .comment-footer .reply-btn:first").data("comment-id");
            var $replyBox = $("#reply-box-" + topLevelCommentId);

            $(".reply-input-box").not($replyBox).hide();
            $replyBox.toggle();

            if ($replyBox.is(":visible")) {
                var $input = $replyBox.find("input[name='content']");
                $input.focus();
                var $parentIdInput = $replyBox.find("input[name='parentId']");
                $parentIdInput.val(clickedCommentId);
                $input.attr("placeholder", "回复 @" + clickedUsername + "...");
            }
        });

        $(document).on("submit", ".reply-form", function(e) {
            e.preventDefault();
            var $form = $(this);
            var formData = $form.serialize();
            var actionUrl = $form.attr("action");

            $.ajax({
                url: actionUrl,
                type: "POST",
                data: formData,
                success: function(data) {
                    if (data.success) {
                        location.reload();
                    } else {
                        alert(data.message || "回复失败");
                    }
                },
                error: function() {
                    alert("回复失败，请重试");
                }
            });
        });

        $(document).click(function(event) {
            const emojiPickers = document.querySelectorAll('.emoji-picker');
            const emojiBtns = document.querySelectorAll('.emoji-btn');

            emojiPickers.forEach(picker => {
                if (picker.classList.contains('show')) {
                    let isClickInside = false;

                    if (picker.contains(event.target)) {
                        isClickInside = true;
                    }

                    emojiBtns.forEach(btn => {
                        if (btn.contains(event.target)) {
                            isClickInside = true;
                        }
                    });

                    if (!isClickInside) {
                        picker.classList.remove('show');
                    }
                }
            });
        });

        $(".delete-btn").click(function(e) {
            var $link = $(this);
            var isComment = $link.attr("href").includes("delete-comment");
            var isPost = $link.attr("href").includes("/forum/delete/");

            if ((isComment || isPost) && !confirm("确定要删除吗？\n\n注意：删除后将同时删除该评论下的所有回复，且无法恢复！")) {
                e.preventDefault();
                return false;
            }
        });
    });
</script>
</body>
</html>
