<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录 - 语文天地</title>
    
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<div class="container">
    <div class="illustration-side">
        <div class="logo-text">
            <img src="/images/微信图片_20260401134545.png" alt="Logo" class="logo-img">
            语文天地
        </div>
        <img src="/images/微信图片_20260401134532.png" alt="插图" class="illustration-img">
    </div>

    <div class="login-side">
        <div class="login-box">
            <div class="avatar-circle">
                <img src="/images/微信图片_20260401134545.png" alt="Logo" style="width: 80px; height: 80px; object-fit: contain;">
            </div>
            <h1>语文天地</h1>

            <p th:if="${error}" class="error-tip" th:text="${error}"></p>

            <form th:action="@{/login}" method="post">
                <div class="form-item">
                    <input type="text" name="username" th:value="${rememberedUsername != null ? rememberedUsername : 'student'}" required placeholder="用户名">
                </div>
                <div class="form-item">
                    <input type="password" name="password" required placeholder="密码">
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember" id="rememberCheckbox">
                        记住我
                    </label>
                    <a th:href="@{/forgot-password}" class="forgot-password">忘记密码</a>
                </div>
                <button type="submit" class="login-btn">登 录</button>
            </form>

            <div class="register-text">
                还没有账号？<a th:href="@{/register}" class="register-link">立即注册</a>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    // 页面加载时，如果有记住的用户名，自动勾选"记住我"
    document.addEventListener('DOMContentLoaded', function() {
        var rememberedUsername = /*[[${rememberedUsername}]]*/ null;
        var usernameInput = document.querySelector('input[name="username"]');
        var rememberCheckbox = document.getElementById('rememberCheckbox');

        if (rememberedUsername && rememberedUsername !== '' && usernameInput.value !== '') {
            rememberCheckbox.checked = true;
        }
    });
</script>
</body>
</html>
