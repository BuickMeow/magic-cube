<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录 - 语文天地</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: url("/images/微信图片_20260401134509.png")no-repeat center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            display: flex;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 1200px;
            width: 100%;
            min-height: 700px;
        }
        .illustration-side {
            flex: 1;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .logo-text {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: bold;
            color: #4a5568;
        }
        .logo-img {
            width: 45px;
            height: 45px;
        }
        .illustration-img {
            max-width: 100%;
            height: auto;
            flex: 1;
            object-fit: contain;
        }
        .login-side {
            flex: 1;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: white;
        }
        .login-box {
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
        }
        .avatar-circle {
            width: auto;
            height: auto;
            background: transparent;
            border-radius: 0;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        .login-box h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 35px;
            font-size: 28px;
            font-weight: bold;
        }
        .form-item {
            margin-bottom: 20px;
        }
        .form-item input[type="text"],
        .form-item input[type="password"] {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        .form-item input[type="text"]:focus,
        .form-item input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .form-item input::placeholder {
            color: #a0a0a0;
        }
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 13px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #606266;
            cursor: pointer;
        }
        .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #667eea;
        }
        .forgot-password {
            color: #667eea;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .forgot-password:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #e8eef5;
            color: #667eea;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .login-btn:hover {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
            transform: translateY(-2px);
        }
        .register-text {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #606266;
        }
        .register-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
            transition: color 0.3s ease;
        }
        .register-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        .error-tip {
            background-color: #fef0f0;
            color: #f56c6c;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 25px;
            text-align: center;
            border-left: 4px solid #f56c6c;
        }
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                max-width: 500px;
            }
            .illustration-side {
                padding: 40px 20px;
            }
            .login-side {
                padding: 40px 30px;
            }
            .logo-text {
                top: 20px;
                left: 20px;
                font-size: 24px;
            }
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .user-info:hover {
            opacity: 0.8;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .username {
            font-size: 14px;
            color: white;
        }
        .logout-btn {
            color: white;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.9;
        }
        .logout-btn:hover {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="illustration-side">
        <div class="logo-text">
            <img src="/images/微信图片_20260401134545.png" alt="Logo" class="logo-img">
            语文天地
        </div>
        <img src="/images/微信图片_20260401134532.png" alt="插图" class="illustration-img">
    </div>

    <div class="login-side">
        <div class="login-box">
            <div class="avatar-circle">
                <img src="/images/微信图片_20260401134545.png" alt="Logo" style="width: 80px; height: 80px; object-fit: contain;">
            </div>
            <h1>语文天地</h1>

            <p th:if="${error}" class="error-tip" th:text="${error}"></p>

            <form th:action="@{/login}" method="post">
                <div class="form-item">
                    <input type="text" name="username" th:value="${rememberedUsername != null ? rememberedUsername : 'student'}" required placeholder="用户名">
                </div>
                <div class="form-item">
                    <input type="password" name="password" required placeholder="密码">
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember" id="rememberCheckbox">
                        记住我
                    </label>
                    <a th:href="@{/forgot-password}" class="forgot-password">忘记密码</a>
                </div>
                <button type="submit" class="login-btn">登 录</button>
            </form>

            <div class="register-text">
                还没有账号？<a th:href="@{/register}" class="register-link">立即注册</a>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    // 页面加载时，如果有记住的用户名，自动勾选"记住我"
    document.addEventListener('DOMContentLoaded', function() {
        var rememberedUsername = /*[[${rememberedUsername}]]*/ null;
        var usernameInput = document.querySelector('input[name="username"]');
        var rememberCheckbox = document.getElementById('rememberCheckbox');

        if (rememberedUsername && rememberedUsername !== '' && usernameInput.value !== '') {
            rememberCheckbox.checked = true;
        }
    });
</script>
</body>
</html>
